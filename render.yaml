services:
  - type: web
    name: mietgate-backend
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: mietgate
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        value: mietgate-uploads
      - key: R2_JURISDICTION
        value: eu
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: "MietGate <noreply@mietgate.de>"
      - key: SUPPORT_EMAIL
        value: "support@mietgate.de"
      - key: FRONTEND_URL
        value: "https://mietgate.de"
      - key: BACKEND_URL
        value: "https://api.mietgate.de"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: "https://mietgate-backend.onrender.com/api/auth/google/callback"
      - key: CORS_ORIGINS
        value: "https://mietgate.de,https://www.mietgate.de"

  - type: web
    name: mietgate-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install --legacy-peer-deps && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_BACKEND_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
